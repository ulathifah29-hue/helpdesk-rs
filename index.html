<h1>Helpdesk Rumah Sakit</h1>

<form id="laporForm">

    <input type="text" id="pelapor" placeholder="Nama Pelapor" required>
    <br><br>

    <input type="text" id="ruangan" placeholder="Ruangan" required>
    <br><br>

    <input type="text" id="alat" placeholder="Alat">
    <br><br>

    <textarea id="kendala" placeholder="Deskripsi Kendala"></textarea>
    <br><br>

    <button type="submit">Kirim Laporan</button>

</form>

<p id="hasil"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const supabaseUrl = "https://igfqwajfoplpubuurqed.supabase.co";

    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnZnF3YWpmb3BscHVidXVycWVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTk1MDYsImV4cCI6MjA5NjE5NTUwNn0.n3256qBTUwZ__UYLlwTZyiiumQ3agDKj4C5nR6WzE3M";

    const db = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );

    document.getElementById("laporForm")
    .addEventListener("submit", async (e) => {

        e.preventDefault();

        const { error } = await db
        .from("tiket")
        .insert([
            {
                pelapor: document.getElementById("pelapor").value,
                ruangan: document.getElementById("ruangan").value,
                alat: document.getElementById("alat").value,
                kendala: document.getElementById("kendala").value
            }
        ]);

        if (error) {

            alert("ERROR: " + error.message);

            document.getElementById("hasil").innerText =
            error.message;

        } else {

            alert("BERHASIL MASUK DATABASE");

            document.getElementById("hasil").innerText =
            "Laporan berhasil dikirim";

            document.getElementById("laporForm").reset();

        }

    });

</script>


</body>
</html>
