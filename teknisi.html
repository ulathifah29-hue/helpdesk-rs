<!DOCTYPE html>

<html>
<head>
    <title>Dashboard Teknisi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Dashboard Teknisi</h1>

<div id="daftarTiket">Loading...</div>

<script>

const supabaseUrl = "https://igfqwajfoplpubuurqed.supabase.co";

const supabaseKey = "sb_publishable_Z34rKKuFpcWY-fJKHTGFfw_EjXEjPUs";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadTiket() {

    const { data, error } = await supabase
        .from('tiket')
        .select('*')
        .order('id', { ascending: false });

    if(error){
        document.getElementById('daftarTiket').innerHTML =
        error.message;
        return;
    }

    let html = "";

    data.forEach(item => {

        html += `
        <div style="border:1px solid #ccc;padding:10px;margin:10px;">
            <h3>Tiket #${item.id}</h3>

            <p>Pelapor : ${item.pelapor}</p>
            <p>Ruangan : ${item.ruangan}</p>
            <p>Alat : ${item.alat}</p>
            <p>Kendala : ${item.kendala}</p>
            <p>Status : ${item.status}</p>
        </div>
        `;
    });

    document.getElementById('daftarTiket').innerHTML = html;
}

loadTiket();

</script>

</body>
</html>
